name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test, Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: ./mvnw clean compile -B

      - name: Fast unit + integration tests (excludes @Tag("slow"))
        run: ./mvnw test -B

      - name: Checkstyle
        run: ./mvnw checkstyle:check -B

      - name: SpotBugs
        run: ./mvnw spotbugs:check -B

      - name: JaCoCo coverage report + critical-path threshold
        run: ./mvnw jacoco:report jacoco:check -B

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Package
        run: ./mvnw package -B -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: salon-booking-api-jar
          path: target/salon-booking-api.jar

  full-test-suite:
    name: Full Test Suite (includes slow/DLQ tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Runs only on main and develop pushes, not on every PR — the slow suite (~90s DLQ
    # test plus full Testcontainers matrix) is too costly for per-commit PR feedback.
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Full test suite
        run: ./mvnw test -B -Pfull-test-suite

  security-scan:
    name: Dependency & Container Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dependency vulnerability scan (OWASP)
        run: ./mvnw org.owasp:dependency-check-maven:check -B
        continue-on-error: false

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: salon-booking-api-jar
          path: target/

      - name: Build Docker image
        run: docker build -t salon-booking-api:${{ github.sha }} .

      - name: Scan container image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'salon-booking-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  architecture-tests:
    name: Architecture Rules (ArchUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run ArchUnit tests only
        run: ./mvnw test -B -Dtest="com.company.salonbooking.architecture.**"