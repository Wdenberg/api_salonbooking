services:
  postgres:
    image: postgres:18
    container_name: salonbooking-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-salonbooking}
      POSTGRES_USER: ${DATABASE_USERNAME:-salonbooking}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-salonbooking}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-salonbooking}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - salonbooking-net

  rabbitmq:
    image: rabbitmq:4-management
    container_name: salonbooking-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - salonbooking-net

  api:
    build: .
    container_name: salonbooking-api
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-salonbooking}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-salonbooking}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-salonbooking}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32chars}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - salonbooking-net

volumes:
  postgres_data:

networks:
  salonbooking-net:
    driver: bridge
