services:

  postgres:
    image: postgres:18
    container_name: salonbooking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DATABASE_NAME:-salonbooking}
      POSTGRES_USER: ${DATABASE_USERNAME:-salonbooking}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-salonbooking}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USERNAME:-salonbooking} -d ${DATABASE_NAME:-salonbooking}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - salonbooking-net


  rabbitmq:
    image: rabbitmq:4-management
    container_name: salonbooking-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "check_port_connectivity"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - salonbooking-net


  api:
    image: wdenberg/salonbooking:1.0.0
    container_name: salonbooking-api
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - salonbooking-net


  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: salonbooking-prometheus
    restart: unless-stopped

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - salonbooking-net

    profiles:
      - observability


volumes:
  postgres_data:
  rabbitmq_data:


networks:
  salonbooking-net:
    driver: bridge