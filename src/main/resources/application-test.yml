spring:
  rabbitmq:
    listener:
      simple:
        auto-startup: false
        acknowledge-mode: manual
        default-requeue-rejected: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    com.company.salonbooking: INFO
app:
  cache:
    # Short TTLs so cache-expiry tests don't need to sleep for minutes.
    business-settings-ttl-seconds: 2
    business-opening-hours-ttl-seconds: 2
    catalog-services-ttl-seconds: 2
    catalog-business-services-ttl-seconds: 2
  outbox:
    # Grande o suficiente para que o poller @Scheduled nunca seja disparado espontaneamente durante os testes;
    # testes que precisam de despacho chamam OutboxPublisherJob.dispatchBatch() diretamente para
    # garantir asserções determinísticas e estáveis ​​(não instáveis).
    poll-interval-millis: 3600000
  reminders:
    # Large enough that the scheduler never fires spontaneously mid-test;
    # tests trigger ReminderSchedulerJob.dispatchDueReminders() directly.
    poll-interval-millis: 3600000