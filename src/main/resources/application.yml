spring:
  application:
    name: salon-booking-api
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.request: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      tags:
        application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

app:
  cache:
    business-settings-ttl-seconds: 600
    business-opening-hours-ttl-seconds: 600
    catalog-services-ttl-seconds: 120
    catalog-business-services-ttl-seconds: 120
    default-max-entries: 10000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Idempotency-Key,X-Correlation-Id
    exposed-headers: X-Correlation-Id
    allow-credentials: false
    max-age: 3600
  rate-limit:
    enabled: true
    default:
      requests-per-minute: 60
      requests-per-second: 10
    endpoints:
      "/api/v1/auth/login":
        requests-per-minute: 5
        requests-per-second: 1
      "/api/v1/auth/register/owner":
        requests-per-minute: 3
        requests-per-second: 1
      "/api/v1/auth/register/customer":
        requests-per-minute: 10
        requests-per-second: 2
      "/api/v1/appointments":
        requests-per-minute: 30
        requests-per-second: 5
  security:
    login-protection:
      max-attempts: 5
      lockout-duration-minutes: 15
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  outbox:
    batch-size: 50
    max-attempts: 5
    initial-backoff-seconds: 5
    max-backoff-seconds: 300
    poll-interval-millis: 5000
    cleanup:
      enabled: true
      retention-days: 30
      schedule-cron: "0 0 3 * * ?"  # Daily at 3 AM
  reminders:
    h24-offset-minutes: 1440   # 24 hours
    h2-offset-minutes: 120     # 2 hours
    poll-interval-millis: 300000  # 5 minutes
logging:
  structured:
    format:
      console: ecs   # Elastic Common Schema: timestamp, level, message, mdc (correlationId, userId...) em JSON
  pattern:
    correlation: "[correlationId=%X{correlationId}] [businessId=%X{businessId}]"