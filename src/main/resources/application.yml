spring:
  application:
    name: salon-booking-api
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.request: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      tags:
        application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

app:
  cache:
    business-settings-ttl-seconds: 600
    business-opening-hours-ttl-seconds: 600
    catalog-services-ttl-seconds: 120
    catalog-business-services-ttl-seconds: 120
    default-max-entries: 10000
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  outbox:
    batch-size: 50
    max-attempts: 5
    initial-backoff-seconds: 5
    max-backoff-seconds: 300
    poll-interval-millis: 5000
  reminders:
    h24-offset-minutes: 1440   # 24 hours
    h2-offset-minutes: 120     # 2 hours
    poll-interval-millis: 300000  # 5 minutes
logging:
  structured:
    format:
      console: ecs   # Elastic Common Schema: timestamp, level, message, mdc (correlationId, userId...) em JSON
  pattern:
    correlation: "[correlationId=%X{correlationId}] [businessId=%X{businessId}]"